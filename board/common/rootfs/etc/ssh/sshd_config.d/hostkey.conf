# Stand-in for the snippet mech will generate from the ietf-system
# ssh/hostkey list.  ssh-hostkeys(8) reads these paths to know where to
# place and validate the keys it generates at boot.
HostKey /etc/ssh/hostkeys/ssh_host_rsa_key
HostKey /etc/ssh/hostkeys/ssh_host_ecdsa_key
HostKey /etc/ssh/hostkeys/ssh_host_ed25519_key
