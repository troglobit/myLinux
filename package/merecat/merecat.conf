# myLinux web server.
#
# Serves the local web UI from /var/www and fronts clixon's native
# RESTCONF, which listens on loopback (see /etc/clixon.xml), over HTTPS.

username  = www-data
directory = /var/www

cgi "/cgi-bin/*" {
    enabled = true
}

# Plain HTTP: send everything to HTTPS.
server default {
    port = 80
    redirect "/" {
        code     = 301
        location = "https://$host$request_uri$args"
    }
}

# HTTPS: the web UI, plus a reverse proxy to clixon RESTCONF.  Paths that
# do not match a proxy rule are served from /var/www.
server secure {
    port = 443
    ssl {
        certfile = /etc/merecat/cert.pem
        keyfile  = /etc/merecat/key.pem
    }
    proxy-pass "/restconf" {
        backend = "http://127.0.0.1:8090"
    }
    proxy-pass "/restconf/**" {
        backend = "http://127.0.0.1:8090"
    }
    proxy-pass "/.well-known/**" {
        backend = "http://127.0.0.1:8090"
    }
    # RESTCONF notifications, server-sent events
    proxy-pass "/streams/**" {
        backend = "http://127.0.0.1:8090"
    }
}
