# BusyBox syslogd + klogd
# Use <pid/syslogd> as barrier for other system tasks and service that
# rely on modules, firmware, and device nodes to be ready.  Each hotplug
# variant is its own service, sharing the barrier via `provides`.

# We want syslogd to always run, never be stopped, regardless of runlevel
# so it can send to any remote syslog server the user has set up.
service syslogd:udev {
    description   = "System log daemon"
    runlevel      = "S0123456789"
    if            = "udevd"
    conditions    = { "run/udevadm:5/success" }
    reload-signal = "none"
    provides      = "pid/syslogd"
    envfile       = "-/etc/default/syslogd"
    command       = "-syslogd -n $SYSLOGD_ARGS"
}
service syslogd:mdev {
    description   = "System log daemon"
    runlevel      = "S0123456789"
    if            = "mdev"
    conditions    = { "run/coldplug/success" }
    reload-signal = "none"
    provides      = "pid/syslogd"
    envfile       = "-/etc/default/syslogd"
    command       = "-syslogd -n $SYSLOGD_ARGS"
}
service syslogd:mdevd {
    description   = "System log daemon"
    runlevel      = "S0123456789"
    if            = "mdevd"
    conditions    = { "run/coldplug/success" }
    reload-signal = "none"
    provides      = "pid/syslogd"
    envfile       = "-/etc/default/syslogd"
    command       = "-syslogd -n $SYSLOGD_ARGS"
}

# klogd depends on syslogd, but BusyBox syslogd doesn't create a PID file to sync with
service klogd {
    description   = "Kernel log daemon"
    runlevel      = "S0123456789"
    conditions    = { "pid/syslogd" }
    reload-signal = "none"
    command       = "klogd -n"
}
