# Requires /etc/chrony.conf to start, see https://chrony.tuxfamily.org/doc/3.4/chrony.conf.html
service chronyd {
    description   = "Chrony NTP v3/v4 daemon"
    runlevel      = "2345"
    reload-signal = "none"
    envfile       = "-/etc/default/chronyd"
    command       = "chronyd -n $CHRONY_ARGS"
}
