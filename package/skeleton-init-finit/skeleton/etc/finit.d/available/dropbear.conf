# <!>: dropbear does not honor SIGHUP.
#  -R: Create hostkeys if needed.
#  -F: Run in foreground.
service dropbear {
    description   = "Dropbear SSH daemon"
    runlevel      = "2345"
    reload-signal = "none"
    envfile       = "-/etc/default/dropbear"
    log { }
    command       = "dropbear -F -R $DROPBEAR_ARGS"
}
