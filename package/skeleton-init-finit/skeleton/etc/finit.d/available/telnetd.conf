service telnetd:23 {
    description   = "Telnet daemon on port 23"
    runlevel      = "2345"
    reload-signal = "none"
    command       = "telnetd -F -p 23"
}
service telnetd:2323 {
    description   = "Telnet daemon on port 2323"
    runlevel      = "2345"
    reload-signal = "none"
    command       = "telnetd -F -p 2323"
}
