task ssh-hostkeys {
    description = "Verifying SSH host keys"
    runlevel    = "S"
    conditions  = { "pid/syslogd" }
    command     = "/usr/bin/ssh-hostkeys"
}
service sshd {
    description = "OpenSSH daemon"
    runlevel    = "2345"
    conditions  = { "task/ssh-hostkeys/success" }
    envfile     = "-/etc/default/sshd"
    command     = "/usr/sbin/sshd -D $SSHD_OPTS"
}
