# Wait for the system to have a default route before starting
service ntpd {
    description   = "NTP daemon"
    runlevel      = "2345"
    conditions    = { "net/route/default" }
    reload-signal = "none"
    envfile       = "-/etc/default/ntpd"
    log { }
    command       = "ntpd -n $NTPD_ARGS"
}
