# This service provides the same sync condition as the BusyBox syslogd,
# which allows us to create a barrier at boot for services that might
# otherwise leak log messages to console.

# Use <pid/syslogd> as barrier for other system tasks and service that
# rely on modules, firmware, and device nodes to be ready.  Each hotplug
# variant is its own service, sharing the barrier via `provides`.
service syslogd:udev {
    description = "System log daemon"
    runlevel    = "S0123456789"
    if          = "udevd"
    conditions  = { "run/udevadm:5/success" }
    provides    = "pid/syslogd"
    envfile     = "-/etc/default/sysklogd"
    command     = "-syslogd -F $SYSLOGD_ARGS"
}
service syslogd:mdev {
    description = "System log daemon"
    runlevel    = "S0123456789"
    if          = "mdev"
    conditions  = { "run/coldplug/success" }
    provides    = "pid/syslogd"
    envfile     = "-/etc/default/sysklogd"
    command     = "-syslogd -F $SYSLOGD_ARGS"
}
service syslogd:mdevd {
    description = "System log daemon"
    runlevel    = "S0123456789"
    if          = "mdevd"
    conditions  = { "run/coldplug/success" }
    provides    = "pid/syslogd"
    envfile     = "-/etc/default/sysklogd"
    command     = "-syslogd -F $SYSLOGD_ARGS"
}
