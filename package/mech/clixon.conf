# Disabled until mech regenerates finit services from startup-config;
# today it only deletes baked enabled/ services (sshd, webif, ...) that
# nothing recreates.  See package/mech/clean-etc.
#run [S] /libexec/clean-etc --
run [S] /libexec/prep-db --
run name:clixon :boot log:prio:daemon.warning \
    [S] clixon_backend -F -l s -1 -s startup -- Loading startup configuration

service name:clixon log:prio:daemon.warning \
	[12345789] clixon_backend -F -l s -s none -- Configuration daemon
service name:restconf log:prio:daemon.warning <pid/clixon> \
	[12345789] clixon_restconf -f /etc/clixon.xml -l s -- RESTCONF server
task [12345789] resolvconf -u -- Update DNS configuration
